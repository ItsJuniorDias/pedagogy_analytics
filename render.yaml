# Deploy 1-clique no Render (New + → Blueprint → aponte pra este repo).
# Cria o web service + um Postgres grátis e liga o DATABASE_URL sozinho.
services:
  - type: web
    name: pedagogy-analytics
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true          # o Render gera um token forte
      - key: RATE_LIMIT_PER_MIN
        value: "300"
      - key: DATABASE_URL
        fromDatabase:
          name: pedagogy-analytics-db
          property: connectionString
      # ---- Meta Conversions API (CAPI) ----
      - key: META_DATASET_ID
        value: "967920369353096"   # ID do pixel (Kid's learning Book app)
      - key: META_API_VERSION
        value: "v25.0"
      - key: META_CAPI_TOKEN
        sync: false                # cole o System User token no painel do Render
      - key: META_TEST_EVENT_CODE
        sync: false                # opcional; só durante testes, depois remova
      # ---- App Store Server Notifications V2 ----
      # Sem APPLE_BUNDLE_ID o webhook sobe DESLIGADO e responde 503 — de
      # propósito: 503 faz a Apple reenviar, então nada se perde enquanto
      # você termina de configurar.
      - key: APPLE_BUNDLE_ID
        sync: false                # o bundle id do app (ex.: com.seudominio.pedagogy)
      - key: APPLE_APP_ID
        value: "6776011454"        # Apple ID do Pedagogy - Kids Books
      - key: APPLE_ENVIRONMENT
        value: Production          # use Sandbox num SEGUNDO serviço, nunca no mesmo
      - key: SUB_HASH_SECRET
        generateValue: true        # ⚠️ gerado UMA vez; trocar órfã as assinaturas

databases:
  - name: pedagogy-analytics-db
    plan: free
